name: CI (Test & Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite & version consistency checks
        run: |
          pytest -v

  build:
    name: Validate Manifest & Build Extension Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Manifest Metadata
        run: |
          python scripts/validate_manifest.py

      - name: Build Extension Package
        run: |
          python scripts/build_dist.py --skip-tests --skip-manuals

      - name: Verify Extension Package Structure
        run: |
          python scripts/validate_manifest.py --check-zip dist/*.zip

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-extension-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
